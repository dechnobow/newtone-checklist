name: Daily Update

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # チェックとプールのバックアップ。git 履歴がそのまま世代管理になる。
      # スクレイパーが失敗しても必ず先に取っておく。
      - name: Back up sync state
        run: |
          curl -fsS "https://newtone-state.dechnobow-newtone.workers.dev/state?key=newtone-main" \
            | python3 -c "import json,sys; j=json.load(sys.stdin); assert j.get('ok'); json.dump(j, open('state-backup.json','w'), ensure_ascii=False, indent=1, sort_keys=True)" \
            && cp state-backup.json "$RUNNER_TEMP/state-backup.json" \
            || echo "state backup skipped"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 playwright

      - name: Install Playwright browser
        run: |
          python -m playwright install --with-deps chromium

      - name: Run scraper
        run: python scraper.py

      # アプリでの日付削除（Worker が data.json を書き換える）とぶつかったら、
      # 最新の data.json を読み直して、今回取得した分だけを書き足し直す。
      - name: Commit and push
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          commit() {
            git add data.json
            for f in state-backup.json scrape-meta.json; do
              if [ -f "$f" ]; then git add "$f"; fi
            done
            git diff --staged --quiet || git commit -m "update data"
          }

          commit
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $i) — re-applying on the latest main"
            sleep $((i * 5))
            git fetch origin main
            git reset --hard origin/main
            if [ -f "$RUNNER_TEMP/state-backup.json" ]; then cp "$RUNNER_TEMP/state-backup.json" state-backup.json; fi
            python scraper.py --merge-only
            commit
          done
          echo "push failed after retries"
          exit 1
