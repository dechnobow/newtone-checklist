<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NT Records">
<title>NEWTONE RECORDS — 新譜チェック</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* NEWTONE RECORDS 本家サイトから抽出した配色 */
    --bg: #f5f4ef;          /* 地色（本家の背景そのまま） */
    --header-bg: #ffffff;   /* ヘッダーだけ白 */
    --surface: #e8e4de;     /* 一段沈んだ面 */
    --surface2: #efeae1;    /* バッジ等 */
    --border: #d5cfc0;
    --accent: #625739;      /* 本家の Sample ボタン等のオリーブ＝構造色 */
    --accent-soft: #eae6da;
    --accent-soft2: #ddd6c4;
    --accent2: #f06021;     /* 本家のブランドオレンジ＝♡/CTA */
    --text: #3f3e3c;
    --text2: #5c5a55;
    --muted: #7a7364;
    --checked-bg: #eae7dc;
    --checked-text: #a09883;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', sans-serif;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  #app-header {
    height: 66px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--header-bg);
    z-index: 100;
  }

  #back-btn {
    display: none;
    background: none;
    border: none;
    color: var(--accent);
    font-size: 31px;
    padding: 4px 8px 4px 0;
    cursor: pointer;
    line-height: 1;
    flex-shrink: 0;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .brand { flex: 1; min-width: 0; }

  .header-title {
    font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', sans-serif;
    font-size: 23px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--accent2);
    text-transform: uppercase;
    line-height: 1;
  }

  #header-sub {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.16em;
    margin-top: 3px;
  }

  #panels {
    flex: 1;
    overflow: hidden;
    position: relative;
  }

  #list-panel {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
    background: var(--bg);
    will-change: transform;
  }

  #day-panel {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    transform: translateX(100%);
    transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
    background: var(--bg);
    will-change: transform;
  }

  #day-panel.visible   { transform: translateX(0); }
  #list-panel.hidden   { transform: translateX(-25%); }

  @media (min-width: 680px) {
    #panels { display: flex; }
    #list-panel, #day-panel {
      position: relative;
      transform: none !important;
      transition: none;
    }
    #list-panel { width: 290px; border-right: 1px solid var(--border); flex-shrink: 0; }
    #day-panel  { flex: 1; }
    #back-btn   { display: none !important; }
  }

  .tree-year-btn {
    width: 100%;
    background: none;
    border: none;
    border-bottom: 1px solid var(--border);
    padding: 17px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', sans-serif;
    font-size: 14px;
    letter-spacing: 0.2em;
    color: var(--accent);
    text-transform: uppercase;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
  }

  .tree-year-btn .arrow { font-size: 13px; transition: transform .2s; }
  .tree-year-btn.collapsed .arrow { transform: rotate(-90deg); }

  .month-block { border-bottom: 1px solid var(--border); }

  .month-btn {
    width: 100%;
    background: none;
    border: none;
    padding: 16px 20px 16px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 17px;
    color: var(--muted);
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    border-left: 3px solid transparent;
    min-height: 56px;
    transition: background .1s;
  }
  .month-btn:active { background: var(--surface); }
  .month-btn.active { color: var(--accent); border-left-color: var(--accent); background: var(--accent-soft); }

  .badge {
    font-size: 14px;
    background: var(--surface2);
    padding: 3px 8px;
    border-radius: 10px;
    color: var(--muted);
    font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', sans-serif;
    flex-shrink: 0;
  }
  .month-btn.active .badge { background: var(--accent-soft2); color: var(--accent); }

  .day-list { overflow: hidden; }
  .day-list.collapsed { display: none; }

  .day-btn {
    width: 100%;
    background: none;
    border: none;
    padding: 15px 20px 15px 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 16px;
    color: var(--muted);
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    border-left: 3px solid transparent;
    min-height: 56px;
    transition: background .1s;
  }
  .day-btn:active { background: var(--surface); }
  .day-btn.active { color: var(--accent); border-left-color: var(--accent); background: var(--accent-soft); }
  .day-btn .badge { font-size: 13px; }

  .day-header {
    position: sticky;
    top: 0;
    background: var(--surface2);
    z-index: 20;
    border-bottom: 1px solid var(--border);
    padding: 14px 20px 12px;
  }

  .day-title {
    font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .progress-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .progress-bar {
    flex: 1;
    height: 3px;
    background: var(--surface2);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width .3s ease;
  }

  .progress-label {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', sans-serif;
    min-width: 50px;
    text-align: right;
  }

  .toolbar {
    display: flex;
    gap: 8px;
    padding: 14px 16px 2px;
  }

  .btn {
    padding: 9px 18px;
    background: var(--header-bg);
    border: 1px solid var(--border);
    color: var(--accent);
    font-size: 14px;
    letter-spacing: 0.04em;
    font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', sans-serif;
    cursor: pointer;
    border-radius: 999px;
    min-height: 42px;
    -webkit-appearance: none;
    transition: all .1s;
  }
  .btn:active { background: var(--surface2); }
  .btn.danger { border-color: transparent; background: none; color: var(--muted); }
  .btn.danger:active { color: var(--accent2); }

  .cat-header {
    margin-top: 12px;
    padding: 11px 16px 10px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', sans-serif;
    font-size: 13px;
    letter-spacing: 0.16em;
    color: var(--accent);
    text-transform: uppercase;
  }
  .cat-count { color: var(--muted); letter-spacing: 0.04em; }

  .record-item {
    display: grid;
    grid-template-columns: 88px 1fr;
    gap: 14px;
    padding: 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    transition: background .1s;
  }
  .record-item:active { background: var(--surface2); }
  .record-item.checked { background: var(--checked-bg); }

  /* ジャケット＋角のチェックバッジ */
  .record-art { position: relative; width: 88px; height: 88px; }

  .record-thumb {
    width: 88px;
    height: 88px;
    object-fit: cover;
    display: block;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 5px;
  }
  .record-item.checked .record-thumb { opacity: .45; }

  .check-circle {
    position: absolute;
    left: -6px;
    top: -6px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--header-bg);
    border: 2px solid #bdb6a4;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: bold;
    color: transparent;
    transition: all .15s;
  }
  .record-item.checked .check-circle {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .record-info { min-width: 0; }

  .record-artist {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.35;
    overflow-wrap: anywhere;
  }
  .record-item.checked .record-artist { color: var(--checked-text); }

  .record-title {
    font-size: 15px;
    color: var(--text2);
    margin-top: 3px;
    line-height: 1.45;
    overflow-wrap: anywhere;
  }
  .record-item.checked .record-title { color: #b4ad9a; }

  .record-tags {
    display: flex;
    gap: 6px;
    margin-top: 9px;
    flex-wrap: wrap;
  }

  .tag {
    font-size: 12px;
    padding: 3px 10px;
    background: var(--header-bg);
    border: 1px solid var(--border);
    color: var(--muted);
    letter-spacing: 0.03em;
    border-radius: 4px;
  }
  .tag.label   { border-color: #897e5f; color: #897e5f; background: none; }
  .tag.used    { color: var(--accent2); border-color: var(--accent2); background: none; }
  .tag.preorder{ color: #3f7d92; border-color: #3f7d92; background: none; }

  /* アクションは 34px の丸アイコンで一列 */
  .record-actions,
  .record-links {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 11px;
  }

  .apple-link,
  .record-link-btn,
  .heart-btn {
    width: 34px;
    height: 34px;
    padding: 0;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    line-height: 1;
    flex-shrink: 0;
    cursor: pointer;
    text-decoration: none;
    -webkit-appearance: none;
    appearance: none;
    transition: transform .1s, color .1s, border-color .1s;
  }
  .apple-link:active,
  .record-link-btn:active,
  .heart-btn:active { transform: scale(.92); }

  .apple-link { background: var(--accent); color: #fff; border: none; }

  .record-link-btn {
    background: var(--header-bg);
    border: 1px solid var(--accent2);
    color: var(--accent2);
    font-size: 17px;
  }

  .heart-btn {
    margin-left: auto;
    width: 40px;
    height: 40px;
    border: none;
    background: none;
    color: var(--border);
    font-size: 22px;
  }
  .heart-btn.pooled { color: var(--accent2); }


  .empty {
    padding: 60px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 17px;
    line-height: 2.2;
  }

  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #cdc6b6; }

  #pool-tab-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 17px;
    padding: 6px 12px;
    border-radius: 20px;
    cursor: pointer;
    flex-shrink: 0;
    min-height: 42px;
    font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', sans-serif;
    letter-spacing: 0.05em;
    transition: all .15s;
  }
  #pool-tab-btn.active { color: var(--accent2); border-color: var(--accent2); background: #fdeadf; }

  #pool-page {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 200;
    background: var(--bg);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #pool-page.visible { display: block; }

  .pool-page-header {
    position: sticky;
    top: 0;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .pool-page-title {
    font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', sans-serif;
    font-size: 16px;
    letter-spacing: 0.2em;
    color: var(--accent2);
    text-transform: uppercase;
  }

  .pool-clear-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 14px;
    padding: 5px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', sans-serif;
    letter-spacing: 0.05em;
  }
  .pool-clear-btn:active { color: var(--accent2); border-color: var(--accent2); }

  .pool-close-btn {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 20px;
    padding: 4px 8px 4px 0;
    cursor: pointer;
    font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', sans-serif;
    flex-shrink: 0;
    min-width: 60px;
    min-height: 44px;
  }

  #settings-page {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 200;
    background: var(--bg);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #settings-page.visible { display: block; }

  .settings-header {
    position: sticky;
    top: 0;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .settings-title {
    font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', sans-serif;
    font-size: 16px;
    letter-spacing: 0.2em;
    color: var(--accent);
    text-transform: uppercase;
    flex: 1;
  }
  .settings-body {
    padding: 24px 20px;
  }
  .settings-section-title {
    font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', sans-serif;
    font-size: 14px;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
  }
  .settings-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .settings-label {
    font-size: 16px;
    color: var(--muted);
    font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', sans-serif;
    min-width: 60px;
  }
  .settings-input {
    background: #fbfaf6;
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 17px;
    padding: 8px 12px;
    border-radius: 4px;
    font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', sans-serif;
    flex: 1;
    min-width: 130px;
  }
  .settings-input:focus { outline: none; border-color: var(--accent); }
  .settings-btn {
    background: none;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-size: 16px;
    padding: 9px 20px;
    border-radius: 4px;
    cursor: pointer;
    font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', sans-serif;
    letter-spacing: 0.08em;
    width: 100%;
    margin-top: 8px;
  }
  .settings-btn:active { background: var(--accent-soft); }
  .settings-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .settings-token-row {
    margin-bottom: 14px;
  }
  .settings-token-input {
    background: #fbfaf6;
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 16px;
    padding: 8px 12px;
    border-radius: 4px;
    font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', sans-serif;
    width: 100%;
    box-sizing: border-box;
  }
  .settings-token-input:focus { outline: none; border-color: var(--accent); }
  .settings-status {
    font-size: 14px;
    color: var(--muted);
    margin-top: 12px;
    font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', sans-serif;
    min-height: 18px;
    white-space: pre-wrap;
  }
  .settings-status.ok { color: var(--accent); }
  .settings-status.err { color: var(--accent2); }
  #gear-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 23px;
    cursor: pointer;
    padding: 4px 8px;
    min-height: 44px;
    min-width: 44px;
  }
  #gear-btn:hover { color: var(--text); }

  /* 旧 Courier Prime だった見出し・ラベル類の太さ調整 */
  .header-title, .tree-year-btn, .day-title, .cat-header,
  .badge, .progress-label, .btn, #pool-tab-btn,
  .pool-page-title, .pool-clear-btn,
  .settings-title, .settings-section-title, .settings-label,
  .settings-btn, .settings-status, .tag {
    font-weight: 500;
  }

  /* 数字が並ぶところだけ字幅を揃える */
  .badge, .progress-label, .day-title, .settings-input {
    font-feature-settings: 'tnum';
    font-variant-numeric: tabular-nums;
  }

  /* 全部ゴシックになった分、字間を少し詰める */
  .header-title, .tree-year-btn, .cat-header,
  .pool-page-title, .settings-title, .settings-section-title {
    letter-spacing: 0.12em;
  }
  .btn, .settings-btn { letter-spacing: 0.06em; }

</style>
</head>
<body>
<div id="app">

  <header id="app-header">
    <button id="back-btn" onclick="showList()">‹</button>
    <div class="brand">
      <div class="header-title">Newtone</div>
      <div id="header-sub">新譜チェック</div>
    </div>
    <button id="pool-tab-btn" onclick="togglePoolPage()">♡ <span id="pool-tab-count">0</span></button>
    <button id="gear-btn" onclick="toggleSettingsPage()" title="設定">⚙</button>
  </header>

  <div id="panels">
    <div id="list-panel"><div id="tree"></div></div>
    <div id="day-panel"><div id="day-content"><div class="empty">読み込み中...</div></div></div>
  </div>

  <div id="pool-page">
    <div id="pool-page-content"></div>
  </div>

  <div id="settings-page">
    <div class="settings-header">
      <button class="pool-close-btn" onclick="toggleSettingsPage()">‹ 戻る</button>
      <div class="settings-title">Settings</div>
    </div>
    <div class="settings-body">

      <div class="settings-section-title">同期</div>
      <div class="settings-status" id="sync-status" style="margin:0 0 14px"></div>

      <div class="settings-section-title" style="margin-top:36px">バックアップから戻す</div>
      <button class="settings-btn" onclick="document.getElementById('import-file').click()">ファイルから読み込む</button>
      <input type="file" id="import-file" accept="application/json" style="display:none"
             onchange="this.files[0] && importState(this.files[0]); this.value=''">
      <div class="settings-status" id="import-status"></div>

    </div>
  </div>

</div>
<script>
// ── Storage helpers ──
const LS_DATA    = 'nt_data';
const LS_CHECKED = 'nt_checked';
const LS_FETCHED = 'nt_fetched';
const LS_POOL    = 'nt_pool';

function loadStorage(key, def) {
  try { return JSON.parse(localStorage.getItem(key) || 'null') ?? def; } catch(e) { return def; }
}
function saveStorage(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
}

// 旧版が使っていた保存キー（削除した日・レコードの記録など）。もう使わない
['nt_removed_ids', 'nt_removed_days', 'nt_updated_at'].forEach(k => {
  try { localStorage.removeItem(k); } catch (_) {}
});

let localData = loadStorage(LS_DATA, {});   // 一覧（data.json）の写し
let checked   = loadStorage(LS_CHECKED, {});
let pool      = loadStorage(LS_POOL, {});
let activeDay = null, activeMonth = null;

// ── Sync ──
// 一覧（data.json）が正本。削除した日は data.json から消えることで表される。
// サーバー（Worker）にはチェックとプールだけを置く。
//   キー: c:<id> チェック / p:<id> プール（値はレコード）
//   値:   { v, ts }。外したチェック・プールは項目ごと消す
// 日付を削除すると、Worker が GitHub の data.json からその日を外す。
const SYNC_API_BASE  = 'https://newtone-state.dechnobow-newtone.workers.dev';
const SYNC_KEY       = 'newtone-main';
const LS_META        = 'nt_meta';
const LS_OUTBOX      = 'nt_outbox';
const LS_LAST_SYNC   = 'nt_last_sync';
const LS_PENDING_DEL = 'nt_pending_deletes';   // { date: { sent, ts } }

const KEY_OK = k => typeof k === 'string' && /^(c|p):/.test(k);

let meta           = loadStorage(LS_META, {});
let outbox         = loadStorage(LS_OUTBOX, []);
let pendingDeletes = loadStorage(LS_PENDING_DEL, {});
let syncTimer = null, deleteTimer = null;
let flushing = false, deleting = false;
let lastClock = 0;

// 旧版の記録（削除した日・レコード、外した印）を手元から外す
(function dropLegacyEntries() {
  let n = 0;
  Object.keys(meta).forEach(k => {
    if (!KEY_OK(k) || !meta[k] || !meta[k].v) { delete meta[k]; n++; }
  });
  const before = outbox.length;
  outbox = outbox.filter(o => o && KEY_OK(o.k));
  if (n) saveStorage(LS_META, meta);
  if (outbox.length !== before) saveStorage(LS_OUTBOX, outbox);
})();

function syncUrl(path, params = {}) {
  const q = new URLSearchParams({ key: SYNC_KEY, ...params });
  return `${SYNC_API_BASE}${path}?${q}`;
}

function clockNow() {
  lastClock = Math.max(lastClock + 1, Date.now());
  return lastClock;
}

function queue(k, v) {
  const ts = clockNow();
  if (v) meta[k] = { v, ts }; else delete meta[k];
  outbox.push({ k, v: v || null, ts });
  saveStorage(LS_META, meta);
  saveStorage(LS_OUTBOX, outbox);
  scheduleSync();
}

function setChecked(id, on) {
  if (!!checked[id] === !!on) return;
  if (on) checked[id] = true; else delete checked[id];
  queue('c:' + id, on ? true : null);
}

function setPooled(id, record) {
  if (record) pool[id] = record; else delete pool[id];
  queue('p:' + id, record || null);
}

// 旧形式（meta なし）の手元の状態を取り込む。ts=1 なので本物の操作には必ず負ける
function adoptLegacy(src) {
  let n = 0;
  const add = (k, v) => {
    if (meta[k]) return;
    meta[k] = { v, ts: 1 };
    outbox.push({ k, v, ts: 1 });
    n++;
  };
  Object.entries(src.checked || {}).forEach(([id, on]) => on && add('c:' + id, true));
  Object.entries(src.pool    || {}).forEach(([id, r])  => r && r.id && add('p:' + id, r));
  if (n) { saveStorage(LS_META, meta); saveStorage(LS_OUTBOX, outbox); }
  return n;
}

// サーバーの内容に手元を合わせる。未送信の項目だけは手元を優先する
function reconcile(server) {
  const pending = new Set(outbox.map(o => o.k));
  const next = {};
  Object.entries(server || {}).forEach(([k, e]) => {
    if (KEY_OK(k) && e && e.v && !pending.has(k)) next[k] = e;
  });
  Object.entries(meta).forEach(([k, e]) => {
    if (pending.has(k)) next[k] = e;
  });
  meta = next;
  saveStorage(LS_META, meta);
}

// meta から表示用のチェック・プールを作り直す
function applyMeta() {
  checked = {}; pool = {};
  Object.entries(meta).forEach(([k, e]) => {
    if (!e || !e.v) return;
    const id = k.slice(2);
    if (k.startsWith('c:')) checked[id] = true;
    else if (k.startsWith('p:') && typeof e.v === 'object' && e.v.id) pool[id] = e.v;
  });
  saveStorage(LS_CHECKED, checked);
  saveStorage(LS_POOL, pool);
}

function scheduleSync(delay = 1500) {
  if (!SYNC_API_BASE) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(flushOutbox, delay);
}

async function flushOutbox() {
  if (!SYNC_API_BASE || flushing || outbox.length === 0) return;
  flushing = true;
  const batch = outbox.slice(0, 100); // keepalive の 64KB 制限に収める
  let ok = false;
  try {
    const res = await fetch(syncUrl('/ops'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ops: batch }),
      keepalive: true,
    });
    const j = await res.json();
    if (!res.ok || !j.ok) throw new Error(j.error || ('HTTP ' + res.status));
    outbox = outbox.slice(batch.length);   // 送れた分だけ外す
    saveStorage(LS_OUTBOX, outbox);
    saveStorage(LS_LAST_SYNC, Date.now());
    if (j.meta) { reconcile(j.meta); applyMeta(); }
    ok = true;
  } catch (e) {
    console.log('sync 送信失敗（未送信として保持し、あとで再送）:', e);
  } finally {
    flushing = false;
  }
  if (outbox.length) scheduleSync(ok ? 200 : 30000);
  updateSyncStatus();
}

async function pullState() {
  adoptLegacy({ checked, pool });   // 初回のみ実質的に動く
  if (SYNC_API_BASE) {
    try {
      const res = await fetch(syncUrl('/state'), { cache: 'no-store' });
      const j = await res.json();
      if (j && j.ok && j.meta && typeof j.meta === 'object') {
        const serverKeys = Object.keys(j.meta).filter(KEY_OK);
        if (serverKeys.length === 0 && Object.keys(meta).length > 0) {
          // サーバーが空になっている。手元の内容でサーバーを作り直す
          const pending = new Set(outbox.map(o => o.k));
          Object.entries(meta).forEach(([k, e]) => { if (!pending.has(k)) outbox.push({ k, v: e.v, ts: e.ts }); });
          saveStorage(LS_OUTBOX, outbox);
        } else {
          reconcile(j.meta);
        }
        saveStorage(LS_LAST_SYNC, Date.now());
      } else if (j && j.ok && j.data) {
        adoptLegacy(j.data);   // 旧 Worker のままでも安全に取り込む
      }
    } catch (e) {
      console.log('sync 取得失敗（手元の状態で続行）:', e);
    }
  }
  applyMeta();
  flushOutbox();
}

// ── 日付の削除（Worker が GitHub の data.json からその日を外す）──
function requestDeleteDay(date) {
  pendingDeletes[date] = { sent: false, ts: Date.now() };
  saveStorage(LS_PENDING_DEL, pendingDeletes);
  scheduleDeletes(300);
}

function scheduleDeletes(delay = 300) {
  if (!SYNC_API_BASE) return;
  clearTimeout(deleteTimer);
  deleteTimer = setTimeout(flushDeletes, delay);
}

async function flushDeletes() {
  if (!SYNC_API_BASE || deleting) return;
  const dates = Object.keys(pendingDeletes).filter(d => !pendingDeletes[d].sent);
  if (!dates.length) { updateSyncStatus(); return; }
  deleting = true;
  let failed = false;
  try {
    await flushOutbox();   // その日のチェックを先に送り切ってから削除を頼む
    for (const date of dates) {
      try {
        const res = await fetch(syncUrl('/delete-day', { date }), { method: 'POST' });
        const j = await res.json();
        if (!res.ok || !j.ok) throw new Error(j.error || ('HTTP ' + res.status));
        pendingDeletes[date] = { ...pendingDeletes[date], sent: true };
        saveStorage(LS_PENDING_DEL, pendingDeletes);
      } catch (e) {
        console.log(`削除の依頼に失敗（${date}・あとで再送）:`, e);
        failed = true;
      }
    }
  } finally {
    deleting = false;
  }
  if (failed) scheduleDeletes(30000);
  updateSyncStatus();
}

// 閉じる直前に未送信分を送る
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { flushOutbox(); flushDeletes(); }
});

// 消されにくいストレージを要求（iOS では保証されないが害もない）
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (_) {}

// ── 設定画面 ──
function updateSyncStatus() {
  const el = document.getElementById('sync-status');
  if (!el) return;
  const last = loadStorage(LS_LAST_SYNC, 0);
  const when = last ? new Date(last).toLocaleString('ja-JP') : '未同期';
  const waiting = Object.values(pendingDeletes).filter(p => !p.sent).length;
  el.textContent =
    `最終同期: ${when}\n` +
    `未送信: ${outbox.length} 件\n` +
    `未反映の削除: ${waiting} 件\n` +
    `プール: ${Object.keys(pool).length} 件`;
  el.className = 'settings-status' + (waiting ? ' err' : '');
}

// GitHub の state-backup.json などから、チェックとプールを戻す（何も消さない）
async function importState(file) {
  const st = document.getElementById('import-status');
  try {
    const j = JSON.parse(await file.text());
    const src = j.meta || {};
    let n = 0;
    Object.entries(src).forEach(([k, e]) => {
      if (!KEY_OK(k) || !e || !e.v) return;
      if (meta[k] && meta[k].v) return;
      queue(k, e.v);
      n++;
    });
    applyMeta();
    tree = buildTree(); renderTree(); updatePoolTabCount();
    if (activeDay) renderDay(activeDay);
    if (st) { st.textContent = `${n} 件を戻しました`; st.className = 'settings-status ok'; }
  } catch (e) {
    if (st) { st.textContent = '読み込みに失敗しました: ' + e.message; st.className = 'settings-status err'; }
  }
  updateSyncStatus();
}

// ── data.json を読み、手元の写しを作り直す ──
async function fetchAndMerge() {
  try {
    const res = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const groups = await res.json();
    if (!Array.isArray(groups) || groups.length === 0) throw new Error('empty data.json');

    // GitHub に反映済みの削除は、削除待ちから外す
    const dates = new Set(groups.map(g => g && g.date));
    let changed = false;
    Object.keys(pendingDeletes).forEach(d => {
      if (pendingDeletes[d].sent && !dates.has(d)) { delete pendingDeletes[d]; changed = true; }
    });
    if (changed) saveStorage(LS_PENDING_DEL, pendingDeletes);

    // 一覧に合わせて作り直す（削除待ちの日は出さない）
    const next = {};
    groups.forEach(g => {
      if (!g || !g.date || pendingDeletes[g.date]) return;
      const category = g.category || 'new';
      const records = (Array.isArray(g.records) ? g.records : []).filter(r => r && r.id);
      if (!records.length) return;
      const key = `${g.date}|${category}`;
      if (next[key]) next[key].records.push(...records);
      else next[key] = { ...g, category, records };
    });
    localData = next;
    saveStorage(LS_DATA, localData);
    saveStorage(LS_FETCHED, Date.now());
  } catch (e) {
    // 読めなかったときは手元の写しで表示する（削除待ちの日は出さない）
    console.log('data.json fetch failed:', e);
    Object.keys(localData).forEach(k => {
      if (pendingDeletes[k.split('|')[0]]) delete localData[k];
    });
  }
}

// ── Build tree from localData ──
function buildTree() {
  const t = {};
  Object.values(localData).forEach(g => {
    const [y, mo] = g.date.split('-');
    const m = y + '-' + mo;
    if (!t[y]) t[y] = {};
    if (!t[y][m]) t[y][m] = {};
    if (!t[y][m][g.date]) t[y][m][g.date] = [];
    t[y][m][g.date].push(...(g.records || []).map(r => ({ ...r, category: g.category })));
  });

  Object.keys(t).forEach(y => Object.keys(t[y]).forEach(m => Object.keys(t[y][m]).forEach(d => {
    const seen = new Set();
    t[y][m][d] = t[y][m][d].filter(r => {
      if (seen.has(r.id)) return false;
      seen.add(r.id);
      return true;
    });
  })));

  return t;
}

let tree = {};

function save() { saveStorage(LS_CHECKED, checked); }
function dayChecked(recs) { return recs.filter(r => checked[r.id]).length; }
const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtMonth(ym) { const [y,m] = ym.split('-'); return MN[+m-1] + ' ' + y; }
function fmtDay(date) { const d = new Date(date + 'T00:00:00'); return `${d.getDate()} ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]}`; }

// ── Pool ──
function savePool() {
  const cleaned = {};
  Object.entries(pool || {}).forEach(([id, record]) => {
    if (record && typeof record === 'object' && record.id) {
      cleaned[id] = record;
    }
  });
  pool = cleaned;
  saveStorage(LS_POOL, pool);
}
  
function updatePoolTabCount() {
  const c = Object.values(pool || {}).filter(record => record && record.id).length;
  const el = document.getElementById('pool-tab-count');
  if (el) el.textContent = String(c);

  const btn = document.getElementById('pool-tab-btn');
  if (btn) btn.style.color = c > 0 ? '#f06021' : '';
}

function togglePool(id, record, event) {
  event.stopPropagation();

  const actualRecord = record || recordMap[id];
  if (!actualRecord || !actualRecord.id) {
    console.warn('pool record not found:', id, record, recordMap[id]);
    return;
  }

  setPooled(id, pool[id] ? null : actualRecord);

  savePool();
  updatePoolTabCount();

  const btn = document.getElementById('heart-' + id);
  if (btn) {
    btn.classList.toggle('pooled', !!pool[id]);
    btn.textContent = pool[id] ? '♥' : '♡';
  }

  if (document.getElementById('pool-page').classList.contains('visible')) {
    renderPoolPage();
  }
}

function removeFromPool(id) {
  setPooled(id, null);
  savePool();
  updatePoolTabCount();
  const btn = document.getElementById('heart-' + id);
  if (btn) { btn.classList.remove('pooled'); btn.textContent = '♡'; }
  renderPoolPage();
}

function clearPool() {
  if (!confirm('プールをすべて削除しますか？')) return;
  Object.keys(pool).forEach(id => {
    const btn = document.getElementById('heart-' + id);
    if (btn) { btn.classList.remove('pooled'); btn.textContent = '♡'; }
    setPooled(id, null);
  });
  savePool();
  updatePoolTabCount();
  renderPoolPage();
}

function renderPoolPage() {
  const items = Object.values(pool || {}).filter(r => r && r.id);

  let html = `
    <div class="pool-page-header">
      <button class="pool-close-btn" onclick="togglePoolPage()">‹ 戻る</button>
      <div class="pool-page-title">POOL — ${items.length} items</div>
      ${items.length > 0 ? '<button class="pool-clear-btn" onclick="clearPool()">すべて削除</button>' : ''}
    </div>
  `;

  if (items.length === 0) {
    html += '<div class="empty">プールは空です</div>';
  } else {

    // ★ Apple Music検索用
    items.forEach(r => { recordMap[r.id] = r; });

    html += items.map(r => `
      <div class="record-item" id="pool-row-${r.id}">
        <div class="record-art">
          <img class="record-thumb"
               src="${r.img || ''}"
               onerror="this.style.opacity=0"
               loading="lazy">
        </div>

        <div class="record-info">

          <div class="record-artist">${r.artist || ''}</div>

          <div class="record-title">${r.title || ''}</div>

          <div class="record-tags">
            ${r.label ? `<span class="tag label">${r.label}</span>` : ''}
            ${r.format ? `<span class="tag">${r.format}</span>` : ''}
            ${r.genre ? `<span class="tag">${r.genre}</span>` : ''}
          </div>

          <div class="record-actions">
            <button
              class="apple-link"
              title="Apple Music で試聴"
              aria-label="Apple Music で試聴"
              onclick="openAppleMusic(recordMap['${r.id}']); event.stopPropagation();"
            >&#9835;</button>

            <a class="record-link-btn"
               href="${r.url || '#'}"
               target="_blank"
               rel="noopener noreferrer"
               title="商品ページ"
               aria-label="商品ページ"
               onclick="event.stopPropagation()">&#8599;</a>

            <button class="heart-btn pooled" aria-label="プールから外す" onclick="removeFromPool('${r.id}')">&#9829;</button>
          </div>

        </div>

      </div>
    `).join('');
  }

  document.getElementById('pool-page-content').innerHTML = html;
}
  
function togglePoolPage() {
  const page = document.getElementById('pool-page');
  const btn = document.getElementById('pool-tab-btn');
  const isVisible = page.classList.contains('visible');

  if (isVisible) {
    page.classList.remove('visible');
    btn.classList.remove('active');
  } else {
    renderPoolPage();
    page.classList.add('visible');
    btn.classList.add('active');
    page.scrollTop = 0;
  }
}

function toggleSettingsPage() {
  const page = document.getElementById('settings-page');
  if (page.classList.contains('visible')) {
    page.classList.remove('visible');
  } else {
    page.classList.add('visible');
    page.scrollTop = 0;
    const st = document.getElementById('import-status');
    if (st) { st.textContent = ''; st.className = 'settings-status'; }
    updateSyncStatus();
  }
}

// ── Render tree ──
function renderTree() {
  let html = '';
  Object.keys(tree).sort().reverse().forEach(y => {
    html += `<button class="tree-year-btn" onclick="toggleYear('${y}')" data-year="${y}">${y}<span class="arrow">▼</span></button><div id="ym-${y}">`;
    Object.keys(tree[y]).sort().reverse().forEach(m => {
      const days = Object.keys(tree[y][m]).sort().reverse();
      const total = days.reduce((a,d) => a + tree[y][m][d].length, 0);
      const open = activeMonth === m;
      html += `<div class="month-block"><button class="month-btn ${open?'active':''}" onclick="toggleMonth('${m}','${y}')" id="mbtn-${m}"><span>${fmtMonth(m)}</span><span class="badge">${total}</span></button><div class="day-list ${open?'':'collapsed'}" id="dl-${m}">`;
      days.forEach(d => {
        const recs = tree[y][m][d]; const chk = dayChecked(recs);
        html += `<button class="day-btn ${activeDay===d?'active':''}" onclick="selectDay('${d}')" id="dbtn-${d}"><span>${fmtDay(d)}</span><span class="badge">${chk}/${recs.length}</span></button>`;
      });
      html += `</div></div>`;
    });
    html += `</div>`;
  });
  if (Object.keys(tree).length === 0) html += '<div class="empty">データがありません</div>';
  document.getElementById('tree').innerHTML = html;
}

function toggleYear(y) {
  const btn = document.querySelector(`[data-year="${y}"]`);
  const list = document.getElementById('ym-' + y);
  btn.classList.toggle('collapsed');
  list.style.display = btn.classList.contains('collapsed') ? 'none' : '';
}

function toggleMonth(m, y) {
  if (activeMonth === m) {
    activeMonth = null;
    document.getElementById('dl-' + m)?.classList.add('collapsed');
    document.getElementById('mbtn-' + m)?.classList.remove('active');
  } else {
    if (activeMonth) {
      document.getElementById('dl-' + activeMonth)?.classList.add('collapsed');
      document.getElementById('mbtn-' + activeMonth)?.classList.remove('active');
    }
    activeMonth = m;
    document.getElementById('dl-' + m)?.classList.remove('collapsed');
    document.getElementById('mbtn-' + m)?.classList.add('active');
  }
}

// ── Day view ──
const catLabels = {
  range:'取得結果',
  thisweek:'今週入荷',
  new:'新入荷',
  preorder:'予約受付中',
  used:'中古盤'

const catOrder = ['range','thisweek','new','preorder','used'];

function selectDay(date) {

let recordMap = {};

function renderDay(date) {
  const [y,mo] = date.split('-'); const m = y + '-' + mo;
  const recs = tree[y]?.[m]?.[date] || [];
  recs.forEach(r => { recordMap[r.id] = r; });
  const chk = dayChecked(recs);
  const pct = recs.length ? Math.round(chk / recs.length * 100) : 0;
  const groups = {};
  recs.forEach(r => {
    const c = r.category || 'new';
    if (!groups[c]) groups[c] = [];
    groups[c].push(r);
  });

  let html = `<div class="day-header">
    <div class="day-title">${date} — ${fmtDay(date)}</div>
    <div class="progress-row">
      <div class="progress-bar"><div class="progress-fill" id="pfill" style="width:${pct}%"></div></div>
      <div class="progress-label" id="plabel">${chk} / ${recs.length}</div>
    </div>
  </div>
  <div class="toolbar">
    <button class="btn" onclick="checkAll('${date}')">すべてチェック</button>
    <button class="btn danger" onclick="uncheckAll('${date}')">リセット</button>
  </div>`;

  const visibleCats = catOrder.filter(c => groups[c] && groups[c].length);

  if (!visibleCats.length) {
    html += `<div class="empty">この日のレコードはありません</div>`;
  } else {
    visibleCats.forEach(cat => {
      const cr = groups[cat];
      const cc = dayChecked(cr);
      html += `<div class="cat-header"><span>${catLabels[cat] || cat}</span><span class="cat-count">${cc}/${cr.length}</span></div>`;
      cr.forEach(r => {
        const ck = !!checked[r.id];
        html += `<div class="record-item ${ck?'checked':''}" id="row-${r.id}" onclick="toggle('${r.id}','${date}')">
          <div class="record-art">
            <img class="record-thumb" src="${r.img || ''}" onerror="this.style.opacity=0" loading="lazy">
            <div class="check-circle">${ck?'✓':''}</div>
          </div>
          <div class="record-info">
            <div class="record-artist">${r.artist || ''}</div>
            <div class="record-title">${r.title || ''}</div>
            <div class="record-tags">
              ${r.label ? `<span class="tag label">${r.label}</span>` : ''}
              ${r.format ? `<span class="tag">${r.format}</span>` : ''}
              ${r.genre ? `<span class="tag">${r.genre}</span>` : ''}
              ${r.used ? `<span class="tag used">USED</span>` : ''}
              ${r.preorder ? `<span class="tag preorder">予約</span>` : ''}
            </div>
            <div class="record-actions">
              <button
                class="apple-link js-apple-btn"
                type="button"
                title="Apple Music で試聴"
                aria-label="Apple Music で試聴"
                data-record-id="${r.id}"
              >&#9835;</button>
              <a class="record-link-btn" href="${r.url || '#'}" target="_self" title="商品ページ" aria-label="商品ページ" onclick="event.stopPropagation()">&#8599;</a>
              <button class="heart-btn ${pool[r.id]?'pooled':''}" id="heart-${r.id}" aria-label="プールに追加" onclick="togglePool('${r.id}',recordMap['${r.id}'],event)">${pool[r.id]?'♥':'♡'}</button>
            </div>
          </div>
        </div>`;
      });
    });
  }

  document.getElementById('day-content').innerHTML = html;

  document.querySelectorAll('#day-content .js-apple-btn').forEach(btn => {
    btn.addEventListener('click', (event) => {
      event.stopPropagation();
      const id = btn.dataset.recordId;
      const record = recordMap[id];
      if (!record) {
        alert('レコード情報を取得できませんでした');
        return;
      }
      openAppleMusic(record);
    });
  });

  document.getElementById('day-panel').scrollTop = 0;
}

function toggle(id, date) {
  setChecked(id, !checked[id]);
  save();
  const row = document.getElementById('row-' + id);
  if (row) {
    const circle = row.querySelector('.check-circle');
    if (checked[id]) { row.classList.add('checked'); circle.textContent = '✓'; }
    else { row.classList.remove('checked'); circle.textContent = ''; }
  }
  updateCatCounts(date);
  updateProgress(date);
  updateDayBadge(date);

  const [y,mo] = date.split('-'); const m = y + '-' + mo;
  const recs = tree[y]?.[m]?.[date] || [];
  const allChecked = recs.length > 0 && recs.every(r => checked[r.id]);
  if (allChecked) {
    setTimeout(() => {
      if (confirm(`${date} のチェックが完了しました。リストから削除しますか？`)) {
        deleteDay(date);
      }
    }, 300);
  }
}

function deleteDay(date) {
  const [y,mo] = date.split('-'); const m = y + '-' + mo;
  const recs = tree[y]?.[m]?.[date] || [];

  // その日のチェックは残さない（サーバー側は削除の依頼と一緒に消える）
  const ids = new Set(recs.map(r => r.id).filter(Boolean));
  ids.forEach(id => { delete checked[id]; delete meta['c:' + id]; });
  outbox = outbox.filter(o => !(o.k.startsWith('c:') && ids.has(o.k.slice(2))));
  saveStorage(LS_CHECKED, checked);
  saveStorage(LS_META, meta);
  saveStorage(LS_OUTBOX, outbox);

  // 手元の写しから外し、GitHub の一覧から外すよう頼む
  Object.keys(localData).forEach(key => {
    if (key.startsWith(date + '|')) delete localData[key];
  });
  saveStorage(LS_DATA, localData);
  requestDeleteDay(date);

  if (tree[y]?.[m]?.[date]) delete tree[y][m][date];
  if (tree[y]?.[m] && Object.keys(tree[y][m]).length === 0) delete tree[y][m];
  if (tree[y] && Object.keys(tree[y]).length === 0) delete tree[y];

  activeDay = null;
  showList();
  renderTree();
  updatePoolTabCount();
  document.getElementById('day-content').innerHTML = '<div class="empty">日付を選んでください</div>';
}

function updateProgress(date) {
  const [y,mo] = date.split('-'); const m = y + '-' + mo;
  const recs = tree[y]?.[m]?.[date] || [];
  const chk = dayChecked(recs);
  const pct = recs.length ? Math.round(chk / recs.length * 100) : 0;
  const pf = document.getElementById('pfill'); if (pf) pf.style.width = pct + '%';
  const pl = document.getElementById('plabel'); if (pl) pl.textContent = chk + ' / ' + recs.length;
}

function updateCatCounts(date) {
  const [y,mo] = date.split('-'); const m = y + '-' + mo;
  const recs = tree[y]?.[m]?.[date] || [];
  const groups = {};
  recs.forEach(r => {
    const c = r.category || 'new';
    if (!groups[c]) groups[c] = [];
    groups[c].push(r);
  });
  document.querySelectorAll('.cat-header').forEach(h => {
    const label = h.querySelector('span:first-child').textContent;
    const cat = Object.keys(catLabels).find(k => catLabels[k] === label);
    if (cat && groups[cat]) h.querySelector('.cat-count').textContent = dayChecked(groups[cat]) + '/' + groups[cat].length;
  });
}

function updateDayBadge(date) {
  const [y,mo] = date.split('-'); const m = y + '-' + mo;
  const recs = tree[y]?.[m]?.[date] || [];
  const chk = dayChecked(recs);
  const badge = document.querySelector('#dbtn-' + date + ' .badge');
  if (badge) badge.textContent = chk + '/' + recs.length;
}

function checkAll(date) {
  const [y,mo] = date.split('-'); const m = y + '-' + mo;
  (tree[y]?.[m]?.[date] || []).forEach(r => setChecked(r.id, true));
  save();
  renderDay(date);
  updateDayBadge(date);
}

function uncheckAll(date) {
  const [y,mo] = date.split('-'); const m = y + '-' + mo;
  (tree[y]?.[m]?.[date] || []).forEach(r => setChecked(r.id, false));
  save();
  renderDay(date);
  updateDayBadge(date);
}

// ── Init ──
async function init() {
  await pullState();
  await fetchAndMerge();
  flushDeletes();   // 前回送れなかった削除があれば送る
  tree = buildTree();
  renderTree();
  updatePoolTabCount();

  const allDays = [];
  Object.keys(tree).forEach(y => Object.keys(tree[y]).forEach(m => Object.keys(tree[y][m]).forEach(d => allDays.push(d))));
  allDays.sort().reverse();

  if (allDays.length) {
    const latest = allDays[0];
    const [y,mo] = latest.split('-');
    activeMonth = y + '-' + mo;
    renderTree();
    if (window.innerWidth >= 680) selectDay(latest);
    else document.getElementById('day-content').innerHTML = '<div class="empty">日付を選んでください</div>';
  } else {
    document.getElementById('day-content').innerHTML = '<div class="empty">データがありません</div>';
  }
}

init();

// ── Apple music ──
function openAppleMusic(record) {
  const title = (record?.title || '').trim();
  const artist = (record?.artist || '').trim();

  const cleanTitle = title
    .replace(/\(.*?\)|（.*?）|\[.*?\]/g, '')
    .replace(/\s+/g, ' ')
    .trim();

  const query = [artist, cleanTitle, 'Apple Music'].filter(Boolean).join(' ');

  if (!query) {
    alert('検索対象がありません');
    return;
  }

  const url =
    'https://www.google.com/search?q=' +
    encodeURIComponent(`site:music.apple.com ${query}`);

  window.open(url, '_blank', 'noopener,noreferrer');
}

</script>
